[project]
name = "to-markdown"
version = "0.1.0"
description = "独立的多格式文件转 Markdown HTTP 服务"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio==4.14.2",
    "beautifulsoup4==4.15.0",
    "fastapi==0.140.7",
    "httpx==0.28.1",
    "markitdown[docx,pdf,pptx,xls,xlsx]==0.1.6",
    "markitdown-ocr[llm]==0.1.0",
    "openai==2.50.0",
    "pdfplumber==0.11.10",
    "pydantic==2.13.4",
    "pypdfium2==5.11.0",
    "python-multipart==0.0.32",
    "starlette==1.3.1",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "pillow==12.3.0",
    "pymupdf==1.28.0",
    "pytest==9.1.1",
]

[tool.uv]
# 本仓库是可直接运行的服务，不构建或安装为 Python 分发包。
package = false
